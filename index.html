<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Rubik Cube</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:'Poppins',sans-serif;
    background:
    radial-gradient(circle at top left,#1f1c2c,#090909 60%),
    linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

/* Background Glow */
body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:#00fff2;
    filter:blur(180px);
    opacity:0.2;
    border-radius:50%;
    top:-100px;
    left:-100px;
}

body::after{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:#ff00ff;
    filter:blur(160px);
    opacity:0.15;
    border-radius:50%;
    bottom:-120px;
    right:-120px;
}

.title{
    position:absolute;
    top:25px;
    font-size:2rem;
    font-weight:700;
    letter-spacing:2px;
    text-shadow:0 0 20px rgba(255,255,255,0.4);
}

/* Scene */
.scene{
    width:250px;
    height:250px;
    perspective:1000px;
}

/* Cube */
.cube{
    width:160px;
    height:160px;
    position:relative;
    transform-style:preserve-3d;
    transform:rotateX(-25deg) rotateY(35deg);
    animation:rotate 10s infinite linear;
    transition:1s ease;
}

@keyframes rotate{
    from{
        transform:rotateX(-25deg) rotateY(0deg);
    }
    to{
        transform:rotateX(-25deg) rotateY(360deg);
    }
}

/* Faces */
.face{
    position:absolute;
    width:160px;
    height:160px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:5px;
    background:rgba(0,0,0,0.4);
    padding:5px;
    border:2px solid rgba(255,255,255,0.2);
    backdrop-filter:blur(10px);
    border-radius:10px;
    box-shadow:
        0 0 25px rgba(255,255,255,0.15),
        inset 0 0 15px rgba(255,255,255,0.08);
}

/* Cube Tiles */
.face div{
    border-radius:6px;
    border:2px solid rgba(255,255,255,0.15);
    box-shadow:
        inset 0 0 10px rgba(255,255,255,0.25),
        0 0 8px rgba(0,0,0,0.4);
}

/* Face Colors */
.front div{ background:#00ffcc; }
.back div{ background:#ff2d75; }
.right div{ background:#ffae00; }
.left div{ background:#6a5cff; }
.top div{ background:#ffffff; }
.bottom div{ background:#32ff7e; }

/* Position Faces */
.front{
    transform:translateZ(80px);
}

.back{
    transform:rotateY(180deg) translateZ(80px);
}

.right{
    transform:rotateY(90deg) translateZ(80px);
}

.left{
    transform:rotateY(-90deg) translateZ(80px);
}

.top{
    transform:rotateX(90deg) translateZ(80px);
}

.bottom{
    transform:rotateX(-90deg) translateZ(80px);
}

/* Buttons */
.controls{
    margin-top:50px;
    display:flex;
    gap:20px;
    z-index:10;
}

button{
    padding:14px 28px;
    border:none;
    border-radius:14px;
    font-size:1rem;
    font-weight:600;
    color:white;
    cursor:pointer;
    transition:0.3s;
    backdrop-filter:blur(10px);
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 0 15px rgba(255,255,255,0.1);
}

button:hover{
    transform:translateY(-4px) scale(1.05);
    box-shadow:
    0 0 25px rgba(0,255,255,0.4),
    0 0 40px rgba(255,0,255,0.25);
}

/* Shuffle Animation */
.shuffle{
    animation:shuffleAnim 1s ease-in-out infinite;
}

@keyframes shuffleAnim{
    0%{
        transform:rotateX(0deg) rotateY(0deg);
    }
    25%{
        transform:rotateX(90deg) rotateY(180deg);
    }
    50%{
        transform:rotateX(180deg) rotateY(90deg);
    }
    75%{
        transform:rotateX(270deg) rotateY(270deg);
    }
    100%{
        transform:rotateX(360deg) rotateY(360deg);
    }
}

</style>
</head>

<body>

<div class="title">3D RUBIK CUBE</div>

<div class="scene">
    <div class="cube" id="cube">

        <div class="face front">
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
        </div>

        <div class="face back">
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
        </div>

        <div class="face right">
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
        </div>

        <div class="face left">
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
        </div>

        <div class="face top">
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
        </div>

        <div class="face bottom">
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
            <div></div><div></div><div></div>
        </div>

    </div>
</div>

<div class="controls">
    <button onclick="solveCube()">Solve Cube</button>
    <button onclick="unsolveCube()">Unsolve Cube</button>
</div>

<script>

const cube = document.getElementById("cube");

function solveCube(){
    cube.classList.remove("shuffle");

    cube.style.transition = "1.5s ease";

    cube.style.transform =
    "rotateX(-25deg) rotateY(35deg)";
}

function unsolveCube(){

    cube.classList.add("shuffle");

    setTimeout(() => {

        cube.classList.remove("shuffle");

        const x = Math.floor(Math.random() * 360);
        const y = Math.floor(Math.random() * 360);

        cube.style.transform =
        `rotateX(${x}deg) rotateY(${y}deg)`;

    }, 2500);
}

</script>

</body>
</html>
