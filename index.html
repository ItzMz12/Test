<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Real 3D Rubik Cube</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:
    radial-gradient(circle at top,#182848,#050505 60%);
    font-family:Arial, sans-serif;
    color:white;
}

h1{
    margin-bottom:20px;
    text-shadow:0 0 15px cyan;
    letter-spacing:2px;
}

.scene{
    width:320px;
    height:320px;
    perspective:1200px;
}

#cube{
    width:180px;
    height:180px;
    position:relative;
    transform-style:preserve-3d;
    transform:rotateX(-30deg) rotateY(-30deg);
    margin:auto;
    transition:0.4s;
}

.cubie{
    position:absolute;
    width:60px;
    height:60px;
    transform-style:preserve-3d;
}

.face{
    position:absolute;
    width:60px;
    height:60px;
    border:2px solid #000;
    border-radius:6px;
    opacity:0.98;
}

/* FACE COLORS */

.white{ background:#fff; }
.yellow{ background:#ffd32a; }
.red{ background:#ff3f34; }
.orange{ background:#ff9f1a; }
.blue{ background:#3742fa; }
.green{ background:#2ed573; }
.black{ background:#111; }

/* POSITION FACES */

.front  { transform:translateZ(30px); }
.back   { transform:rotateY(180deg) translateZ(30px); }
.right  { transform:rotateY(90deg) translateZ(30px); }
.left   { transform:rotateY(-90deg) translateZ(30px); }
.top    { transform:rotateX(90deg) translateZ(30px); }
.bottom { transform:rotateX(-90deg) translateZ(30px); }

.controls{
    margin-top:25px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    width:90%;
    max-width:500px;
}

button{
    padding:10px 16px;
    border:none;
    border-radius:10px;
    background:#111;
    color:white;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
    border:1px solid rgba(255,255,255,0.15);
}

button:hover{
    transform:scale(1.08);
    background:#222;
    box-shadow:0 0 15px cyan;
}

.info{
    margin-top:15px;
    opacity:0.7;
    font-size:14px;
}

</style>
</head>
<body>

<h1>REAL 3D RUBIK CUBE</h1>

<div class="scene">
    <div id="cube"></div>
</div>

<div class="controls">

<button onclick="move('R')">R</button>
<button onclick="move('L')">L</button>
<button onclick="move('U')">U</button>
<button onclick="move('D')">D</button>
<button onclick="move('F')">F</button>
<button onclick="move('B')">B</button>

<button onclick="move('Ri')">R'</button>
<button onclick="move('Li')">L'</button>
<button onclick="move('Ui')">U'</button>
<button onclick="move('Di')">D'</button>
<button onclick="move('Fi')">F'</button>
<button onclick="move('Bi')">B'</button>

<button onclick="shuffleCube()">Shuffle</button>
<button onclick="resetCube()">Solve</button>

</div>

<div class="info">
Drag mouse to rotate whole cube
</div>

<script>

const cube = document.getElementById("cube");

let rotateX = -30;
let rotateY = -30;

let cubies = [];

/* CREATE 27 SMALL CUBES */

function createCube(){

    cube.innerHTML = "";
    cubies = [];

    for(let x=-1;x<=1;x++){
        for(let y=-1;y<=1;y++){
            for(let z=-1;z<=1;z++){

                const cubie = document.createElement("div");
                cubie.className = "cubie";

                cubie.x = x;
                cubie.y = y;
                cubie.z = z;

                createFace(cubie,"front", z===1 ? "green":"black");
                createFace(cubie,"back", z===-1 ? "blue":"black");
                createFace(cubie,"right", x===1 ? "red":"black");
                createFace(cubie,"left", x===-1 ? "orange":"black");
                createFace(cubie,"top", y===-1 ? "white":"black");
                createFace(cubie,"bottom", y===1 ? "yellow":"black");

                updatePosition(cubie);

                cube.appendChild(cubie);

                cubies.push(cubie);
            }
        }
    }
}

function createFace(cubie,side,color){

    const face = document.createElement("div");

    face.className = `face ${side} ${color}`;

    cubie.appendChild(face);
}

function updatePosition(cubie){

    cubie.style.transform =
    `
    translate3d(
    ${cubie.x*60}px,
    ${cubie.y*60}px,
    ${cubie.z*60}px
    )
    `;
}

createCube();

/* REAL ROTATIONS */

function rotateLayer(axis, layer, clockwise=true){

    cubies.forEach(c=>{

        if(c[axis] === layer){

            let x = c.x;
            let y = c.y;
            let z = c.z;

            if(axis==="x"){

                c.y = clockwise ? -z : z;
                c.z = clockwise ? y : -y;
            }

            if(axis==="y"){

                c.x = clockwise ? z : -z;
                c.z = clockwise ? -x : x;
            }

            if(axis==="z"){

                c.x = clockwise ? -y : y;
                c.y = clockwise ? x : -x;
            }

            updatePosition(c);
        }
    });
}

/* MOVE SYSTEM */

function move(m){

    switch(m){

        case "R": rotateLayer("x",1,true); break;
        case "Ri": rotateLayer("x",1,false); break;

        case "L": rotateLayer("x",-1,false); break;
        case "Li": rotateLayer("x",-1,true); break;

        case "U": rotateLayer("y",-1,true); break;
        case "Ui": rotateLayer("y",-1,false); break;

        case "D": rotateLayer("y",1,false); break;
        case "Di": rotateLayer("y",1,true); break;

        case "F": rotateLayer("z",1,true); break;
        case "Fi": rotateLayer("z",1,false); break;

        case "B": rotateLayer("z",-1,false); break;
        case "Bi": rotateLayer("z",-1,true); break;
    }
}

/* SHUFFLE */

function shuffleCube(){

    const moves = [
    "R","L","U","D","F","B",
    "Ri","Li","Ui","Di","Fi","Bi"
    ];

    for(let i=0;i<20;i++){

        const random =
        moves[Math.floor(Math.random()*moves.length)];

        move(random);
    }
}

/* RESET */

function resetCube(){

    createCube();
}

/* MOUSE ROTATION */

let dragging = false;
let lastX,lastY;

document.addEventListener("mousedown",(e)=>{

    dragging = true;

    lastX = e.clientX;
    lastY = e.clientY;
});

document.addEventListener("mouseup",()=>{

    dragging = false;
});

document.addEventListener("mousemove",(e)=>{

    if(!dragging) return;

    let dx = e.clientX - lastX;
    let dy = e.clientY - lastY;

    rotateY += dx * 0.5;
    rotateX -= dy * 0.5;

    cube.style.transform =
    `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

    lastX = e.clientX;
    lastY = e.clientY;
});

</script>

</body>
</html>
