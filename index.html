<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Neon Tic Tac Toe</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top left,#4f46e5,#0f172a 40%),
    radial-gradient(circle at bottom right,#06b6d4,#111827 40%);
    overflow:hidden;
}

.container{
    width:350px;
    padding:30px;
    border-radius:30px;
    backdrop-filter:blur(14px);
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:
    0 0 30px rgba(0,0,0,0.4),
    0 0 60px rgba(99,102,241,0.3);
    text-align:center;
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
}

h1{
    color:white;
    margin-bottom:10px;
    font-size:2.2rem;
    letter-spacing:2px;
}

.status{
    color:#cbd5e1;
    margin-bottom:20px;
    font-size:1rem;
    font-weight:500;
}

.board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.cell{
    width:90px;
    height:90px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:2.5rem;
    font-weight:700;
    color:white;
    cursor:pointer;
    transition:0.25s;
    user-select:none;
}

.cell:hover{
    transform:scale(1.05);
    background:rgba(255,255,255,0.15);
    box-shadow:0 0 15px rgba(255,255,255,0.2);
}

.x{
    color:#38bdf8;
    text-shadow:0 0 15px #38bdf8;
}

.o{
    color:#f472b6;
    text-shadow:0 0 15px #f472b6;
}

button{
    margin-top:25px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:15px;
    background:linear-gradient(135deg,#06b6d4,#6366f1);
    color:white;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:0 0 20px rgba(99,102,241,0.5);
}

.footer{
    margin-top:15px;
    color:#94a3b8;
    font-size:0.8rem;
}
</style>
</head>

<body>

<div class="container">

    <h1>Tic Tac Toe</h1>

    <div class="status" id="status">
        Player X's Turn
    </div>

    <div class="board" id="board">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>

    <button id="restartBtn">Restart Game</button>

    <div class="footer">
        Neon Theme • Responsive Design
    </div>

</div>

<script>
const cells = document.querySelectorAll(".cell");
const statusText = document.getElementById("status");
const restartBtn = document.getElementById("restartBtn");

let currentPlayer = "X";
let gameActive = true;
let board = ["","","","","","","","",""];

const winPatterns = [
    [0,1,2],
    [3,4,5],
    [6,7,8],
    [0,3,6],
    [1,4,7],
    [2,5,8],
    [0,4,8],
    [2,4,6]
];

function handleCellClick(e){
    const cell = e.target;
    const index = [...cells].indexOf(cell);

    if(board[index] !== "" || !gameActive) return;

    board[index] = currentPlayer;
    cell.textContent = currentPlayer;
    cell.classList.add(currentPlayer.toLowerCase());

    checkWinner();

    if(gameActive){
        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusText.textContent = `Player ${currentPlayer}'s Turn`;
    }
}

function checkWinner(){
    let winner = false;

    winPatterns.forEach(pattern=>{
        const [a,b,c] = pattern;

        if(
            board[a] &&
            board[a] === board[b] &&
            board[a] === board[c]
        ){
            winner = true;
        }
    });

    if(winner){
        statusText.textContent = `🎉 Player ${currentPlayer} Wins!`;
        gameActive = false;
        return;
    }

    if(!board.includes("")){
        statusText.textContent = "🤝 It's a Draw!";
        gameActive = false;
    }
}

function restartGame(){
    board = ["","","","","","","","",""];
    currentPlayer = "X";
    gameActive = true;

    statusText.textContent = "Player X's Turn";

    cells.forEach(cell=>{
        cell.textContent = "";
        cell.classList.remove("x","o");
    });
}

cells.forEach(cell=>{
    cell.addEventListener("click",handleCellClick);
});

restartBtn.addEventListener("click",restartGame);
</script>

</body>
</html>footer>

<h2>🚀 FUTUREVERSE 2099</h2>

<p>
Designed with HTML, CSS & JavaScript
</p>

</footer>

<!-- SWIPE INDICATOR -->

<div class="swipe-indicator"></div>
<div class="swipe-text">SWIPE</div>

<!-- NEW PAGE -->

<div class="page-slider" id="pageSlider">

<h1>WELCOME TO<br>THE NEXT DIMENSION 🚀</h1>

<p>
You unlocked the futuristic hidden page by sliding right.
Works on both mobile touch and desktop drag.
</p>

<button class="close-page" onclick="closePage()">
GO BACK
</button>

</div>

<script>

/* Calculator */

const display = document.getElementById("display");

function append(value){
display.value += value;
}

function clearDisplay(){
display.value = "";
}

function calculate(){
try{
display.value = eval(display.value);
}catch{
display.value = "ERROR";
}
}

/* Scroll Reveal */

window.addEventListener("scroll",()=>{

document.querySelectorAll(".reveal").forEach(el=>{

const windowHeight = window.innerHeight;
const revealTop = el.getBoundingClientRect().top;

if(revealTop < windowHeight - 100){
el.classList.add("active");
}

});

});

/* Mini Game */

let score = 0;

document.getElementById("clickBtn").addEventListener("click",()=>{

score++;

document.getElementById("score").innerText = score;

document.getElementById("clickBtn").style.transform =
`scale(${1 + Math.random()*0.3}) rotate(${Math.random()*10-5}deg)`;

});

/* Mouse Glow */

document.addEventListener("mousemove",(e)=>{

const glow = document.createElement("div");

glow.style.position = "fixed";
glow.style.left = e.clientX + "px";
glow.style.top = e.clientY + "px";
glow.style.width = "10px";
glow.style.height = "10px";
glow.style.borderRadius = "50%";
glow.style.background = "#00f0ff";
glow.style.pointerEvents = "none";
glow.style.boxShadow = "0 0 20px #00f0ff";
glow.style.zIndex = "9999";

document.body.appendChild(glow);

setTimeout(()=>{
glow.remove();
},300);

});

/* Dynamic Title */

const titles = [
"🚀 FutureVerse",
"⚡ Next Gen UI",
"🌌 Cyber Future",
"🤖 AI Universe"
];

let i = 0;

setInterval(()=>{

document.title = titles[i % titles.length];
i++;

},2000);

/* =========================
RIGHT SWIPE PAGE SYSTEM
========================= */

let startX = 0;
let currentX = 0;
let isDraggingPage = false;

/* MOBILE */

document.addEventListener("touchstart",(e)=>{

startX = e.touches[0].clientX;

});

document.addEventListener("touchmove",(e)=>{

currentX = e.touches[0].clientX;

let diff = startX - currentX;

/* Swipe Right */

if(diff < -140){

openPage();

}

});

/* PC */

document.addEventListener("mousedown",(e)=>{

isDraggingPage = true;
startX = e.clientX;

});

document.addEventListener("mousemove",(e)=>{

if(!isDraggingPage) return;

currentX = e.clientX;

let diff = startX - currentX;

/* Drag Right */

if(diff < -180){

openPage();

}

});

document.addEventListener("mouseup",()=>{

isDraggingPage = false;

});

/* Open */

function openPage(){

document.getElementById("pageSlider")
.classList.add("active");

}

/* Close */

function closePage(){

document.getElementById("pageSlider")
.classList.remove("active");

}

</script>

</body>
</html>
