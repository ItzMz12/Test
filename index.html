<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Playable 3D Rubik Cube</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
    radial-gradient(circle at top,#1f2a44,#090909 60%);
    font-family:'Poppins',sans-serif;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
}

h1{
    margin-bottom:20px;
    font-size:2.2rem;
    letter-spacing:2px;
    text-shadow:0 0 20px cyan;
}

.scene{
    perspective:1200px;
    width:320px;
    height:320px;
}

.cube{
    width:210px;
    height:210px;
    position:relative;
    transform-style:preserve-3d;
    transform:rotateX(-25deg) rotateY(35deg);
    transition:1s ease;
    margin:auto;
}

.face{
    position:absolute;
    width:210px;
    height:210px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:4px;
    background:#111;
    padding:4px;
    border-radius:12px;
    border:2px solid rgba(255,255,255,0.15);
    box-shadow:0 0 20px rgba(255,255,255,0.1);
}

.tile{
    border-radius:8px;
    border:2px solid rgba(255,255,255,0.15);
    cursor:pointer;
    transition:0.2s;
}

.tile:hover{
    transform:scale(1.06);
    filter:brightness(1.2);
}

/* Faces Position */

.front{ transform:translateZ(105px); }
.back{ transform:rotateY(180deg) translateZ(105px); }
.right{ transform:rotateY(90deg) translateZ(105px); }
.left{ transform:rotateY(-90deg) translateZ(105px); }
.top{ transform:rotateX(90deg) translateZ(105px); }
.bottom{ transform:rotateX(-90deg) translateZ(105px); }

.controls{
    margin-top:30px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
}

button{
    padding:14px 24px;
    border:none;
    border-radius:14px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    color:white;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.2);
    transition:0.3s;
}

button:hover{
    transform:translateY(-4px);
    box-shadow:0 0 20px cyan;
}

.info{
    margin-top:15px;
    opacity:0.8;
    font-size:0.9rem;
}

</style>
</head>
<body>

<h1>3D PLAYABLE RUBIK CUBE</h1>

<div class="scene">
    <div class="cube" id="cube">

        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
        <div class="face right" id="right"></div>
        <div class="face left" id="left"></div>
        <div class="face top" id="top"></div>
        <div class="face bottom" id="bottom"></div>

    </div>
</div>

<div class="controls">
    <button onclick="rotateCube('x')">Rotate X</button>
    <button onclick="rotateCube('y')">Rotate Y</button>
    <button onclick="shuffleCube()">Unsolve Cube</button>
    <button onclick="solveCube()">Solve Cube</button>
</div>

<div class="info">
Tap tiles to change colors manually
</div>

<script>

const colors = [
    "#00ffc3",
    "#ff4757",
    "#ffa502",
    "#3742fa",
    "#ffffff",
    "#2ed573"
];

const faces = ["front","back","right","left","top","bottom"];

let currentX = -25;
let currentY = 35;

function createCube(){

    faces.forEach((face,index)=>{

        const faceElement = document.getElementById(face);

        for(let i=0;i<9;i++){

            const tile = document.createElement("div");

            tile.classList.add("tile");

            tile.style.background = colors[index];

            tile.dataset.colorIndex = index;

            tile.addEventListener("click",()=>{

                let next =
                (parseInt(tile.dataset.colorIndex)+1)%colors.length;

                tile.dataset.colorIndex = next;

                tile.style.background = colors[next];

            });

            faceElement.appendChild(tile);
        }
    });
}

createCube();

function rotateCube(axis){

    const cube = document.getElementById("cube");

    if(axis === "x"){
        currentX += 90;
    }else{
        currentY += 90;
    }

    cube.style.transform =
    `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
}

function shuffleCube(){

    document.querySelectorAll(".tile").forEach(tile=>{

        const random =
        Math.floor(Math.random()*colors.length);

        tile.style.background = colors[random];

        tile.dataset.colorIndex = random;
    });

    currentX += 180;
    currentY += 180;

    document.getElementById("cube").style.transform =
    `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
}

function solveCube(){

    faces.forEach((face,index)=>{

        const tiles =
        document.querySelectorAll(`#${face} .tile`);

        tiles.forEach(tile=>{

            tile.style.background = colors[index];

            tile.dataset.colorIndex = index;
        });
    });

    currentX = -25;
    currentY = 35;

    document.getElementById("cube").style.transform =
    `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
}

</script>

</body>
</html>
